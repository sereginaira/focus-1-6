<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef3855">
  <meta name="description" content="Спаси Париж и выучи Sport Unit: английский словарь, фразы и Past Simple в приключении с Леди Баг и Супер-Котом.">
  <title>Miraculous English · Sport Mission</title>
  <link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Miraculous English — главный экран">
      <img src="assets/emblem.svg" alt="" width="42" height="42">
      <span>MIRACULOUS <b>ENGLISH</b></span>
    </button>
    <nav aria-label="Главная навигация">
      <button data-action="map" class="nav-link" id="nav-map">Миссии</button>
      <button data-action="dictionary" class="nav-link" id="nav-dictionary">Словарь</button>
      <button data-action="rules" class="nav-link" id="nav-rules">Шпаргалка</button>
    </nav>
    <div class="top-actions">
      <span id="header-score" class="score-pill" title="Твой рекорд">✦ 0</span>
      <button class="icon-button" id="sound-toggle" data-action="sound" aria-label="Выключить звук" aria-pressed="true">♪</button>
      <button class="icon-button" data-action="settings" aria-label="Настройки">⚙</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="footer"><span><i class="status-dot"></i> Суперсилы доступны офлайн</span><span>SPORT UNIT <b>06</b> <span class="footer-separator">/</span> Учись. Играй. Спасай Париж.</span></footer>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="effects" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript>Для игры включи JavaScript в настройках браузера.</noscript>
</body>
</html>
